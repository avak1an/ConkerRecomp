name: Source boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.release.check --revision HEAD
      - run: python -m unittest tools.test_prepare tools.test_source_boundary tools.test_launcher_backend tools.test_generator_config
      - run: cmake -S src/launcher -B build/launcher -A x64 -DCONKER_LAUNCHER_TEST=ON
      - run: cmake --build build/launcher --config Release
      - run: python -m unittest tools.test_launcher_title_art
